<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>献立ノート</title>

<!-- iPhoneでホーム画面に追加したときアプリらしく動くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="献立ノート" />
<meta name="theme-color" content="#F5F1E6" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-32.png" />
<link rel="manifest" href="manifest.json" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #F5F1E6; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // window.storage の代わりに localStorage を使う簡易シム
  // Claudeのアーティファクト用API (get/set/list) と同じ形で使えるようにしている
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!prefix || k.startsWith(prefix)) keys.push(k);
      }
      return { keys, prefix };
    },
  };
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

/* ---------- 簡易アイコン（外部ライブラリなしで完結させるため自前のSVGに置き換え） ---------- */
const Icon = ({ children, size = 16, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={style}>
    {children}
  </svg>
);
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6" /></Icon>;
const UtensilsCrossed = (p) => <Icon {...p}><path d="M16 2l-4 9 2 2 6-6" /><path d="M13.5 6.5L21 14" /><path d="M6 2l3 8-4 4-4-4z" /><path d="M5 14L2 22" /></Icon>;
const CalendarDays = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M12 3v12" /><polyline points="7 11 12 16 17 11" /><line x1="5" y1="21" x2="19" y2="21" /></Icon>;
const Upload = (p) => <Icon {...p}><path d="M12 21V9" /><polyline points="7 13 12 8 17 13" /><line x1="5" y1="3" x2="19" y2="3" /></Icon>;

/* ---------- ここから下は元のアプリと同じロジック ---------- */

const STORES = ["万代", "スギ薬局", "イトーヨーカドー", "ライフ", "西友", "マルエツ", "オーケー"];
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

const pad = (n) => String(n).padStart(2, "0");
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => toDateStr(new Date());
const shiftDate = (str, delta) => {
  const d = new Date(str + "T00:00:00");
  d.setDate(d.getDate() + delta);
  return toDateStr(d);
};
const shiftMonth = (ym, delta) => {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
};
const emptyDay = () => ({ dinner: [], shopping: [] });
const yen = (n) => `¥${Number(n || 0).toLocaleString("ja-JP")}`;
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const toHalfWidth = (str) => str.replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
const sanitizeAmount = (raw) => toHalfWidth(raw).replace(/[^\d]/g, "");

function DayPanel({
  dateLabel, day, loading,
  mealOpen, setMealOpen, mealName, setMealName, addMeal, removeMeal,
  shopOpen, setShopOpen, shopForm, setShopForm, addShopping, removeShopping,
  dailyTotal, onPrev, onNext, dateInputValue, onDateInputChange, onClose,
}) {
  return (
    <>
      <div className="card" style={{ padding: "8px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, border: "1px solid #E6DEC9" }}>
        {onPrev ? <button onClick={onPrev} style={{ background: "none", border: "none", padding: 6 }}><ChevronLeft size={20} color="#2B3A44" /></button> : <span style={{ width: 32 }} />}
        <div style={{ textAlign: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 14.5 }}>{dateLabel}</div>
          {onDateInputChange && <input type="date" value={dateInputValue} onChange={onDateInputChange} style={{ border: "none", background: "transparent", fontSize: 11, color: "#63737A" }} />}
        </div>
        {onNext ? <button onClick={onNext} style={{ background: "none", border: "none", padding: 6 }}><ChevronRight size={20} color="#2B3A44" /></button> : (
          onClose ? <button onClick={onClose} style={{ background: "none", border: "none", padding: 6 }}><X size={18} color="#63737A" /></button> : <span style={{ width: 32 }} />
        )}
      </div>

      {loading ? (
        <div style={{ textAlign: "center", padding: 30, color: "#63737A", fontSize: 13 }}>読み込み中…</div>
      ) : (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, display: "flex", alignItems: "center", gap: 6 }}>
              <UtensilsCrossed size={15} /> 夜の献立
            </div>
            <button onClick={() => { setMealOpen(!mealOpen); setMealName(""); }} style={{ background: "#F5F1E6", border: "1px solid #E6DEC9", borderRadius: 8, padding: "3px 8px", display: "flex", alignItems: "center", gap: 3, fontSize: 11.5 }}>
              <Plus size={12} /> 追加
            </button>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: mealOpen ? 8 : 12 }}>
            {day.dinner.length === 0 && <span style={{ fontSize: 12, color: "#B8AF98" }}>まだ記録がありません</span>}
            {day.dinner.map((m) => (
              <span key={m.id} className="chip">
                {m.name}
                <X size={12} style={{ cursor: "pointer" }} onClick={() => removeMeal(m.id)} />
              </span>
            ))}
          </div>
          {mealOpen && (
            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <input
                placeholder="例：鮭の塩焼き定食"
                value={mealName}
                onChange={(e) => setMealName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addMeal()}
                style={{ flex: 1, border: "1px solid #E6DEC9", borderRadius: 8, padding: "6px 8px", fontSize: 12.5, minWidth: 0 }}
              />
              <button onClick={addMeal} style={{ background: "#A85A32", color: "#fff", border: "none", borderRadius: 8, padding: "6px 10px", fontSize: 12 }}>追加</button>
            </div>
          )}

          <div style={{ fontWeight: 700, fontSize: 13.5, margin: "6px 0 8px", borderTop: "1px dashed #E6DEC9", paddingTop: 12 }}>
            買い物記録
          </div>
          <datalist id="stores">{STORES.map((s) => <option key={s} value={s} />)}</datalist>
          {day.shopping.map((s) => (
            <div key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px dashed #E6DEC9", fontSize: 13 }}>
              <span>{s.store}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 700 }}>{yen(s.price)}</span>
                <X size={13} style={{ cursor: "pointer", color: "#B8AF98" }} onClick={() => removeShopping(s.id)} />
              </div>
            </div>
          ))}
          {!shopOpen ? (
            <button onClick={() => setShopOpen(true)} style={{ marginTop: 8, background: "#F5F1E6", border: "1px solid #E6DEC9", borderRadius: 8, padding: "6px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 4 }}>
              <Plus size={12} /> 買い物を追加
            </button>
          ) : (
            <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
              <input list="stores" placeholder="お店（例：ライフ）" value={shopForm.store} onChange={(e) => setShopForm({ ...shopForm, store: e.target.value })} style={{ border: "1px solid #E6DEC9", borderRadius: 8, padding: "7px 8px", fontSize: 12.5 }} />
              <input type="text" inputMode="numeric" placeholder="金額" value={shopForm.price} onChange={(e) => setShopForm({ ...shopForm, price: sanitizeAmount(e.target.value) })} style={{ border: "1px solid #E6DEC9", borderRadius: 8, padding: "7px 8px", fontSize: 12.5 }} />
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={addShopping} style={{ flex: 1, background: "#A85A32", color: "#fff", border: "none", borderRadius: 8, padding: "8px", fontSize: 12.5, fontWeight: 700 }}>追加する</button>
                <button onClick={() => setShopOpen(false)} style={{ background: "#F5F1E6", border: "1px solid #E6DEC9", borderRadius: 8, padding: "8px 12px", fontSize: 12.5 }}>閉じる</button>
              </div>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, paddingTop: 10, borderTop: "2px solid #2B3A44" }}>
            <span style={{ fontWeight: 700, fontSize: 13 }}>本日の合計</span>
            <span style={{ fontWeight: 700, fontSize: 16, color: "#B33F3F" }}>{yen(dailyTotal)}</span>
          </div>
        </>
      )}
    </>
  );
}

function App() {
  const [date, setDate] = useState(todayStr());
  const [day, setDay] = useState(emptyDay());
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("record");
  const [mealOpen, setMealOpen] = useState(false);
  const [mealName, setMealName] = useState("");
  const [shopOpen, setShopOpen] = useState(false);
  const [shopForm, setShopForm] = useState({ store: "", price: "" });

  const [calMonth, setCalMonth] = useState(todayStr().slice(0, 7));
  const [monthSpend, setMonthSpend] = useState({});
  const [calLoading, setCalLoading] = useState(false);
  const [budget, setBudget] = useState(null);
  const [budgetInput, setBudgetInput] = useState("");
  const [panelOpenDate, setPanelOpenDate] = useState(null);

  const [ioMessage, setIoMessage] = useState("");
  const [ioBusy, setIoBusy] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      try {
        const res = await window.storage.get(`day:${date}`);
        const parsed = res ? JSON.parse(res.value) : emptyDay();
        if (!parsed.dinner) parsed.dinner = [];
        if (!parsed.shopping) parsed.shopping = [];
        if (!cancelled) setDay(parsed);
      } catch {
        if (!cancelled) setDay(emptyDay());
      }
      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [date]);

  const persist = useCallback((next) => {
    setDay(next);
    const total = next.shopping.reduce((a, s) => a + s.price, 0);
    setMonthSpend((prev) => {
      const copy = { ...prev };
      if (total > 0) copy[date] = total; else delete copy[date];
      return copy;
    });
    window.storage.set(`day:${date}`, JSON.stringify(next)).catch((e) => console.error("save failed", e));
  }, [date]);

  const addMeal = () => {
    if (!mealName.trim()) return;
    persist({ ...day, dinner: [...day.dinner, { id: uid(), name: mealName.trim() }] });
    setMealName("");
  };
  const removeMeal = (id) => {
    persist({ ...day, dinner: day.dinner.filter((m) => m.id !== id) });
  };
  const addShopping = () => {
    if (!shopForm.price) return;
    persist({ ...day, shopping: [...day.shopping, { id: uid(), store: shopForm.store.trim() || "その他", price: Number(shopForm.price) }] });
    setShopForm({ store: "", price: "" });
  };
  const removeShopping = (id) => {
    persist({ ...day, shopping: day.shopping.filter((s) => s.id !== id) });
  };
  const dailyTotal = day.shopping.reduce((a, s) => a + s.price, 0);

  const loadCalendar = useCallback(async () => {
    setCalLoading(true);
    try {
      const listed = await window.storage.list(`day:${calMonth}`);
      const keys = listed?.keys || [];
      const map = {};
      for (const k of keys) {
        try {
          const r = await window.storage.get(k);
          if (r) {
            const parsed = JSON.parse(r.value);
            const total = (parsed.shopping || []).reduce((a, s) => a + s.price, 0);
            if (total > 0) map[k.replace("day:", "")] = total;
          }
        } catch {}
      }
      setMonthSpend(map);
    } catch {
      setMonthSpend({});
    }
    try {
      const b = await window.storage.get(`budget:${calMonth}`);
      setBudget(b ? Number(b.value) : null);
      setBudgetInput(b ? b.value : "");
    } catch {
      setBudget(null);
      setBudgetInput("");
    }
    setCalLoading(false);
  }, [calMonth]);

  useEffect(() => { if (tab === "calendar") loadCalendar(); }, [tab, calMonth, loadCalendar]);

  const [budgetSaved, setBudgetSaved] = useState(false);
  const saveBudget = () => {
    const v = Number(sanitizeAmount(budgetInput));
    if (!v) return;
    setBudget(v);
    setBudgetInput(String(v));
    setBudgetSaved(true);
    setTimeout(() => setBudgetSaved(false), 1500);
    window.storage.set(`budget:${calMonth}`, String(v)).catch((e) => console.error("budget save failed", e));
  };

  const monthTotal = Object.values(monthSpend).reduce((a, b) => a + b, 0);
  const remaining = budget !== null ? budget - monthTotal : null;
  const ratio = budget ? Math.min(monthTotal / budget, 1) : 0;
  const barColor = ratio < 0.75 ? "#5C7A52" : ratio < 1 ? "#C79A2E" : "#B33F3F";

  const [year, month] = calMonth.split("-").map(Number);
  const startWeekday = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const cells = [...Array(startWeekday).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => {
    const d = i + 1;
    return { day: d, dateStr: `${year}-${pad(month)}-${pad(d)}` };
  })];

  const fmtLabel = (ds) => new Date(ds + "T00:00:00").toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });

  const openCellForEdit = (dateStr) => {
    setDate(dateStr);
    setPanelOpenDate(dateStr);
    setMealOpen(false);
    setShopOpen(false);
  };

  const handleExport = async () => {
    setIoBusy(true);
    setIoMessage("");
    try {
      const dayKeys = (await window.storage.list("day:"))?.keys || [];
      const budgetKeys = (await window.storage.list("budget:"))?.keys || [];
      const days = {};
      for (const k of dayKeys) {
        const r = await window.storage.get(k);
        if (r) days[k] = JSON.parse(r.value);
      }
      const budgets = {};
      for (const k of budgetKeys) {
        const r = await window.storage.get(k);
        if (r) budgets[k] = r.value;
      }
      const payload = { exportedAt: new Date().toISOString(), days, budgets };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `献立ノート_${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setIoMessage(`書き出し完了（${dayKeys.length}日分）`);
    } catch (e) {
      console.error(e);
      setIoMessage("書き出しに失敗しました");
    }
    setIoBusy(false);
  };

  const handleImportFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setIoBusy(true);
    setIoMessage("");
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const data = JSON.parse(reader.result);
        let count = 0;
        for (const [k, v] of Object.entries(data.days || {})) {
          await window.storage.set(k, JSON.stringify(v));
          count++;
        }
        for (const [k, v] of Object.entries(data.budgets || {})) {
          await window.storage.set(k, String(v));
        }
        setIoMessage(`読み込み完了（${count}日分）`);
        const res = await window.storage.get(`day:${date}`);
        setDay(res ? JSON.parse(res.value) : emptyDay());
        if (tab === "calendar") loadCalendar();
      } catch (err) {
        console.error(err);
        setIoMessage("読み込みに失敗しました。ファイル形式をご確認ください");
      }
      setIoBusy(false);
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div style={{ background: "#F5F1E6", minHeight: "100vh", fontFamily: "'Zen Kaku Gothic New', sans-serif", color: "#2B3A44" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
        .mincho { font-family: 'Shippori Mincho', serif; }
        .card { background:#FFFDF8; border:1px solid #E6DEC9; border-radius: 14px; }
        .tabbtn { clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%); transition: transform .15s ease, opacity .15s ease; }
        .chip { display:inline-flex; align-items:center; gap:6px; background:#F5F1E6; border:1px solid #E6DEC9; border-radius:999px; padding:4px 10px; font-size:12.5px; }
        input, select { font-family: inherit; }
        input:focus, select:focus { outline: 2px solid #A85A3255; }
        button { -webkit-tap-highlight-color: transparent; }
      `}</style>

      <div style={{ maxWidth: 460, margin: "0 auto", padding: "18px 14px 40px" }}>
        <div className="mincho" style={{ fontSize: 22, fontWeight: 700, textAlign: "center", marginBottom: 2 }}>献立ノート</div>
        <div style={{ textAlign: "center", fontSize: 11.5, color: "#63737A", marginBottom: 14 }}>夜の献立とお買い物の記録帳</div>

        <div style={{ display: "flex", gap: 4, marginBottom: -1, position: "relative", zIndex: 1 }}>
          {[
            { id: "record", label: "記録", icon: UtensilsCrossed, color: "#A85A32" },
            { id: "calendar", label: "カレンダー", icon: CalendarDays, color: "#7A93A0" },
          ].map((t) => {
            const IconComp = t.icon;
            const active = tab === t.id;
            return (
              <button
                key={t.id}
                className="tabbtn"
                onClick={() => setTab(t.id)}
                style={{
                  flex: 1, padding: "10px 4px 12px", border: "none", cursor: "pointer",
                  background: active ? t.color : "#E6DEC9",
                  color: active ? "#fff" : "#63737A",
                  transform: active ? "translateY(0)" : "translateY(4px)",
                  opacity: active ? 1 : 0.85,
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 3, fontSize: 12, fontWeight: 700,
                }}
              >
                <IconComp size={16} />
                {t.label}
              </button>
            );
          })}
        </div>

        <div className="card" style={{ padding: 16, position: "relative", zIndex: 0 }}>
          {tab === "record" ? (
            <DayPanel
              dateLabel={fmtLabel(date)}
              day={day}
              loading={loading}
              mealOpen={mealOpen} setMealOpen={setMealOpen} mealName={mealName} setMealName={setMealName} addMeal={addMeal} removeMeal={removeMeal}
              shopOpen={shopOpen} setShopOpen={setShopOpen} shopForm={shopForm} setShopForm={setShopForm} addShopping={addShopping} removeShopping={removeShopping}
              dailyTotal={dailyTotal}
              onPrev={() => setDate(shiftDate(date, -1))}
              onNext={() => setDate(shiftDate(date, 1))}
              dateInputValue={date}
              onDateInputChange={(e) => setDate(e.target.value)}
            />
          ) : (
            <>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <button onClick={() => setCalMonth(shiftMonth(calMonth, -1))} style={{ background: "none", border: "none", padding: 6 }}><ChevronLeft size={20} /></button>
                <div className="mincho" style={{ fontWeight: 700, fontSize: 16 }}>{year}年{month}月</div>
                <button onClick={() => setCalMonth(shiftMonth(calMonth, 1))} style={{ background: "none", border: "none", padding: 6 }}><ChevronRight size={20} /></button>
              </div>

              <div className="card" style={{ padding: 12, border: "1px solid #E6DEC9", marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12.5, marginBottom: 8 }}>
                  <span>今月の予算</span>
                  {budgetSaved && <span style={{ fontSize: 11, color: "#5C7A52", fontWeight: 700 }}>保存しました ✓</span>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
                  <input
                    type="text" inputMode="numeric"
                    value={budgetInput}
                    onChange={(e) => setBudgetInput(sanitizeAmount(e.target.value))}
                    onBlur={saveBudget}
                    onKeyDown={(e) => { if (e.key === "Enter") { e.currentTarget.blur(); } }}
                    placeholder="例：30000"
                    style={{ flex: 1, minWidth: 0, border: "1px solid #E6DEC9", borderRadius: 8, padding: "9px 10px", fontSize: 14 }}
                  />
                  <span style={{ fontSize: 12.5, color: "#63737A" }}>円</span>
                  <button onClick={saveBudget} style={{ background: "#A85A32", color: "#fff", border: "none", borderRadius: 8, padding: "9px 14px", fontSize: 13, fontWeight: 700, flexShrink: 0 }}>保存</button>
                </div>
                <div style={{ height: 8, background: "#EDE7D6", borderRadius: 99, overflow: "hidden", marginBottom: 6 }}>
                  <div style={{ width: `${ratio * 100}%`, height: "100%", background: barColor, borderRadius: 99 }} />
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                  <span>使用済み：<b style={{ color: "#B33F3F" }}>{yen(monthTotal)}</b></span>
                  {budget !== null && <span>残り：<b style={{ color: remaining >= 0 ? "#5C7A52" : "#B33F3F" }}>{yen(remaining)}</b></span>}
                </div>
              </div>

              {calLoading ? (
                <div style={{ textAlign: "center", padding: 30, color: "#63737A", fontSize: 13 }}>読み込み中…</div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 14 }}>
                  {WEEKDAYS.map((w) => (
                    <div key={w} style={{ textAlign: "center", fontSize: 11, color: "#63737A", fontWeight: 700, paddingBottom: 4 }}>{w}</div>
                  ))}
                  {cells.map((c, i) => c === null ? (
                    <div key={i} />
                  ) : (
                    <button
                      key={i}
                      onClick={() => openCellForEdit(c.dateStr)}
                      style={{
                        aspectRatio: "1", border: c.dateStr === panelOpenDate ? "2px solid #A85A32" : "1px solid #E6DEC9",
                        borderRadius: 8, background: monthSpend[c.dateStr] ? "#FBF3E7" : "#fff",
                        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                        padding: 2, cursor: "pointer",
                      }}
                    >
                      <span style={{ fontSize: 11, color: "#2B3A44" }}>{c.day}</span>
                      {monthSpend[c.dateStr] > 0 && (
                        <span style={{ fontSize: 9, color: "#B33F3F", fontWeight: 700, lineHeight: 1.1 }}>
                          ¥{monthSpend[c.dateStr] >= 10000 ? `${(monthSpend[c.dateStr] / 1000).toFixed(1)}k` : monthSpend[c.dateStr].toLocaleString("ja-JP")}
                        </span>
                      )}
                    </button>
                  ))}
                </div>
              )}

              {panelOpenDate && (
                <div className="card" style={{ padding: 14, border: "1px solid #E6DEC9", marginBottom: 16 }}>
                  <DayPanel
                    dateLabel={fmtLabel(panelOpenDate)}
                    day={day}
                    loading={loading}
                    mealOpen={mealOpen} setMealOpen={setMealOpen} mealName={mealName} setMealName={setMealName} addMeal={addMeal} removeMeal={removeMeal}
                    shopOpen={shopOpen} setShopOpen={setShopOpen} shopForm={shopForm} setShopForm={setShopForm} addShopping={addShopping} removeShopping={removeShopping}
                    dailyTotal={dailyTotal}
                    onClose={() => setPanelOpenDate(null)}
                  />
                </div>
              )}

              <div style={{ borderTop: "1px dashed #E6DEC9", paddingTop: 12 }}>
                <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>データの書き出し・読み込み</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={handleExport} disabled={ioBusy} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#7A93A0", color: "#fff", border: "none", borderRadius: 8, padding: "9px", fontSize: 12.5, fontWeight: 700 }}>
                    <Download size={14} /> 書き出し
                  </button>
                  <button onClick={() => fileInputRef.current?.click()} disabled={ioBusy} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#F5F1E6", border: "1px solid #E6DEC9", borderRadius: 8, padding: "9px", fontSize: 12.5, fontWeight: 700 }}>
                    <Upload size={14} /> 読み込み
                  </button>
                  <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImportFile} style={{ display: "none" }} />
                </div>
                {ioMessage && <div style={{ fontSize: 11.5, color: "#63737A", marginTop: 8, textAlign: "center" }}>{ioMessage}</div>}
                <div style={{ fontSize: 10.5, color: "#B8AF98", marginTop: 8 }}>※書き出しはJSONファイルとして端末に保存されます。読み込みは同じ形式のファイルのみ対応しています。</div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
